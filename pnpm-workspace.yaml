packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: set this to true or false
  unrs-resolver: set this to true or false

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0

nodeLinker: hoisted
overrides:
  "@sinclair/typebox": ^0.34.0
  # Transitive peers of expo/@expo/cli/expo-router whose lockfile pins lag
  # the range expo 55.0.23 declares (wants ^55.0.6 / ^55.0.11).
  "@expo/dom-webview": ^55.0.6
  "@expo/metro-runtime": ^55.0.11
# pnpm 11 blocks dependency build scripts by default; these need theirs
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
