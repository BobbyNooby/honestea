packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: set this to true or false
  unrs-resolver: set this to true or false

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-image-picker@57.0.16
  - expo-router@57.0.19

nodeLinker: hoisted
overrides:
  "@sinclair/typebox": ^0.34.0
# pnpm 11 blocks dependency build scripts by default; these need theirs
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
