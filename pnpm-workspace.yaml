packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

# pnpm 11 blocks dependency build scripts unless allowed here.
allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-image-picker@57.0.16
  - expo-router@57.0.19

overrides:
  "@sinclair/typebox": ^0.34.0
