    <path d="M20 42 H72 L68 78 Q66 86 58 86 H34 Q26 86 24 78 Z"/>
    <path d="M72 50 Q84 52 84 60 Q84 68 72 70"/>
    <path d="M44 30 Q40 22 46 14 Q56 18 52 30 Z" fill="#000000"/>
    <path d="M58 34 Q60 28 56 22"/>
  </g>
</svg>
