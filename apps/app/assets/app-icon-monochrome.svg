<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HonesTea cup monochrome">
  <!-- Themed-icon variant for Android. Single-color, no fills — the OS
       tints this with the user's accent color. Thicker strokes than the
       full-color icon so the silhouette holds at small sizes after the OS
       applies a luminance filter. -->
